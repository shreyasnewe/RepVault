{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block body %}
<div class="container narrow">

    <h1>{{ title }}</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST">

        <label>Exercise</label>
        <input type="text" name="exercise" value="{{ workout.exercise or '' }}" required>

        <label>Muscle</label>
        <select name="muscle">
            {% for m in muscles %}
            <option value="{{ m }}" {% if workout.muscle == m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
        </select>

        <label>Sets</label>
        <input type="number" name="sets" min="1" value="{{ workout.sets or '' }}" required>

        <label>Reps</label>
        <input type="number" name="reps" min="1" value="{{ workout.reps or '' }}" required>

        <label>Weight (kg)</label>
        <input type="number" step="0.5" min="0" name="weight" value="{{ workout.weight or '' }}" required>

        <div class="form-buttons">
            <button class="btn" type="submit">{{ button }}</button>
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Back</a>
        </div>

    </form>

</div>
{% endblock %}
